<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instrument — Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --charcoal: #1D2226;
    --panel: #262B30;
    --panel-hi: #2E343A;
    --cream: #F0EBDD;
    --cream-dim: #C9C4B4;
    --brass: #C9A227;
    --brass-dim: #8A7423;
    --muted: #8B939A;
    --line: rgba(240,235,221,0.09);
    --line-strong: rgba(240,235,221,0.16);
    --slate-blue: #6C97AC;
    --danger: #C96A4D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--charcoal);
    color: var(--cream);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* ---- search / header ---- */
  .search-row{
    display:flex;
    gap:8px;
    margin-bottom: 22px;
    position: relative;
  }
  #search-input{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--line-strong);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 11px 14px;
    border-radius: 6px;
    outline: none;
  }
  #search-input::placeholder{ color: var(--muted); }
  #search-input:focus{ border-color: var(--brass-dim); }
  .icon-btn{
    background: var(--panel);
    border: 1px solid var(--line-strong);
    color: var(--cream);
    border-radius: 6px;
    width: 40px;
    height: 40px;
    flex-shrink:0;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 16px;
    transition: border-color 0.15s;
  }
  .icon-btn:hover{ border-color: var(--brass-dim); }
  .icon-btn:active{ transform: scale(0.96); }

  .suggestions{
    position:absolute;
    top: 46px;
    left:0; right:0;
    background: var(--panel-hi);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    overflow:hidden;
    z-index: 10;
    display:none;
  }
  .suggestions.show{ display:block; }
  .suggestion-item{
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    color: var(--cream-dim);
  }
  .suggestion-item:last-child{ border-bottom:none; }
  .suggestion-item:hover{ background: var(--panel); color: var(--cream); }
  .suggestion-item span{ color: var(--muted); font-size: 11px; display:block; margin-top:2px; }

  /* ---- quick chips ---- */
  .chip-row{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }
  .chip{
    background: var(--panel);
    border: 1px solid var(--line-strong);
    color: var(--cream-dim);
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    padding: 7px 13px;
    border-radius: 20px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .chip:hover{ border-color: var(--brass-dim); color: var(--cream); }
  .chip:active{ transform: scale(0.97); }

  .welcome{
    padding: 30px 0 10px;
    text-align:center;
  }
  .welcome-title{
    font-family:'Space Grotesk', monospace;
    font-size: 20px;
    font-weight: 600;
    color: var(--cream);
    margin-bottom: 6px;
  }
  .welcome-sub{
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  /* ---- map ---- */
  .map-panel{
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  #map{
    height: 220px;
    width: 100%;
    background: var(--panel);
  }
  .leaflet-tile-pane{ filter: saturate(0.85) brightness(0.9); }
  .leaflet-control-attribution{
    background: rgba(38,43,48,0.85) !important;
    color: var(--muted) !important;
    font-size: 9.5px !important;
  }
  .leaflet-control-attribution a{ color: var(--cream-dim) !important; }
  .leaflet-control-zoom a{
    background: var(--panel) !important;
    color: var(--cream) !important;
    border-color: var(--line-strong) !important;
  }

  /* ---- status ---- */
  #status{
    padding: 60px 0;
    text-align:center;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  #status.err{ color: var(--danger); }

  /* ---- hero / current ---- */
  .hero{ display:none; }
  .hero.show{ display:block; }

  .place-line{
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .updated-line{
    font-size: 11px;
    color: var(--muted);
    opacity: 0.7;
    margin-bottom: 22px;
  }

  .dial{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 24px;
    margin-bottom: 18px;
    position: relative;
  }
  .dial-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .temp-block{ display:flex; align-items:flex-start; gap: 4px; }
  .temp-num{
    font-family:'Space Grotesk', monospace;
    font-size: 76px;
    font-weight: 600;
    line-height: 0.9;
    color: var(--cream);
    letter-spacing: -0.02em;
  }
  .temp-unit{
    font-family:'Space Grotesk', monospace;
    font-size: 28px;
    font-weight: 500;
    color: var(--brass);
    margin-top: 6px;
  }
  .cond-block{ text-align:right; }
  .cond-icon{ font-size: 34px; margin-bottom: 6px; }
  .cond-text{ font-size: 14px; color: var(--cream-dim); font-weight: 500; }

  .dial-bottom{
    display:flex;
    gap: 20px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
  }
  .dial-bottom b{ color: var(--cream-dim); font-weight: 500; }

  .source-note{
    font-size: 11px;
    color: var(--muted);
    opacity: 0.65;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  /* ---- section label ---- */
  .section-label{
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 26px 0 10px;
  }

  /* ---- hourly ---- */
  .hourly-scroll{
    display:flex;
    gap: 2px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .hourly-scroll::-webkit-scrollbar{ display:none; }
  .hour-card{
    flex: 0 0 auto;
    width: 62px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 0 10px;
    text-align:center;
  }
  .hour-time{ font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .hour-icon{ font-size: 18px; margin-bottom: 8px; }
  .hour-temp{ font-family:'Space Grotesk', monospace; font-size: 15px; font-weight:600; color: var(--cream); }
  .hour-precip{ font-size: 10px; color: var(--slate-blue); margin-top: 4px; height: 12px; }

  /* ---- daily ---- */
  .daily-list{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .day-row{
    display:grid;
    grid-template-columns: 74px 28px 1fr 90px;
    align-items:center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .day-row:last-child{ border-bottom:none; }
  .day-row{ cursor: pointer; transition: background 0.15s; }
  .day-row:hover{ background: var(--panel-hi); }
  .day-row.active{ background: var(--panel-hi); box-shadow: inset 3px 0 0 var(--brass); }
  .day-row.active .day-name{ color: var(--cream); }
  .day-name{ color: var(--cream-dim); font-weight: 500; }
  .day-icon{ font-size: 16px; text-align:center; }
  .day-precip{ font-size: 11px; color: var(--slate-blue); text-align:right; padding-right: 6px; min-width: 30px; }
  .day-range{ display:flex; align-items:center; gap: 8px; justify-self:end; font-family:'Space Grotesk', monospace; }
  .day-lo{ color: var(--muted); width: 26px; text-align:right; }
  .day-hi{ color: var(--cream); width: 26px; text-align:right; }
  .day-bar-track{ width: 60px; height: 3px; background: var(--line-strong); border-radius: 2px; position:relative; }
  .day-bar-fill{ position:absolute; height:3px; border-radius: 2px; background: var(--brass); }

  /* ---- details grid ---- */
  .details-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .detail-card{
    background: var(--panel);
    padding: 16px 14px;
  }
  .detail-label{
    font-size: 10.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .detail-value{
    font-family:'Space Grotesk', monospace;
    font-size: 20px;
    font-weight: 600;
    color: var(--cream);
  }
  .detail-sub{
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  footer{
    text-align:center;
    font-size: 11px;
    color: var(--muted);
    opacity: 0.6;
    margin-top: 34px;
    line-height: 1.6;
  }

  @media (max-width: 420px){
    .temp-num{ font-size: 62px; }
    .details-grid{ grid-template-columns: repeat(2, 1fr); }
    .day-row{ grid-template-columns: 60px 24px 1fr 76px; padding: 10px 12px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="search-row">
    <input id="search-input" type="text" placeholder="Search city or place" autocomplete="off" />
    <button class="icon-btn" id="locate-btn" title="Use current location" aria-label="Use current location">◎</button>
    <div class="suggestions" id="suggestions"></div>
  </div>

  <div class="chip-row" id="chip-row">
    <button class="chip" data-lat="41.7003" data-lon="-70.3002" data-name="Cape Cod, Massachusetts">Cape Cod, MA</button>
    <button class="chip" data-lat="44.3386" data-lon="-68.2733" data-name="Acadia National Park, Maine">Acadia, ME</button>
    <button class="chip" data-lat="44.0537" data-lon="-71.1284" data-name="North Conway, New Hampshire">North Conway, NH</button>
  </div>

  <div id="status" style="display:none;"></div>

  <div class="welcome" id="welcome">
    <div class="welcome-title">Where's the weather?</div>
    <div class="welcome-sub">Search a place, tap a shortcut above, or try your location.</div>
  </div>

  <div class="hero" id="hero">
    <div class="place-line" id="place-line">—</div>
    <div class="updated-line" id="updated-line">—</div>

    <div class="dial">
      <div class="dial-top">
        <div class="temp-block">
          <span class="temp-num" id="temp-num">--</span>
          <span class="temp-unit" id="temp-unit">°F</span>
        </div>
        <div class="cond-block">
          <div class="cond-icon" id="cond-icon">—</div>
          <div class="cond-text" id="cond-text">—</div>
        </div>
      </div>
      <div class="dial-bottom">
        <span>Feels <b id="feels-like">—</b></span>
        <span>High <b id="today-hi">—</b></span>
        <span>Low <b id="today-lo">—</b></span>
      </div>
    </div>

    <div class="source-note" id="source-note"></div>

    <div class="map-panel">
      <div id="map"></div>
    </div>

    <div class="section-label" id="hourly-label">Next 24 hours</div>
    <div class="hourly-scroll" id="hourly-scroll"></div>

    <div class="section-label">7-day forecast</div>
    <div class="daily-list" id="daily-list"></div>

    <div class="section-label">Conditions</div>
    <div class="details-grid" id="details-grid"></div>

    <footer>Data from Open-Meteo, blending NOAA / National Weather Service (US), ECMWF, and other national forecast models. Updated on load.</footer>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const statusEl = document.getElementById('status');
const heroEl = document.getElementById('hero');
const welcomeEl = document.getElementById('welcome');
let unit = 'fahrenheit'; // default, will be set based on location
let currentCoords = null;
let currentPlaceName = null;
let leafletMap = null;
let leafletMarker = null;

const WMO = {
  0:  ['Clear sky', '☀'],
  1:  ['Mainly clear', '🌤'],
  2:  ['Partly cloudy', '⛅'],
  3:  ['Overcast', '☁'],
  45: ['Fog', '🌫'],
  48: ['Rime fog', '🌫'],
  51: ['Light drizzle', '🌦'],
  53: ['Drizzle', '🌦'],
  55: ['Dense drizzle', '🌦'],
  56: ['Freezing drizzle', '🌧'],
  57: ['Freezing drizzle', '🌧'],
  61: ['Light rain', '🌧'],
  63: ['Rain', '🌧'],
  65: ['Heavy rain', '🌧'],
  66: ['Freezing rain', '🌧'],
  67: ['Freezing rain', '🌧'],
  71: ['Light snow', '🌨'],
  73: ['Snow', '🌨'],
  75: ['Heavy snow', '🌨'],
  77: ['Snow grains', '🌨'],
  80: ['Light showers', '🌦'],
  81: ['Showers', '🌦'],
  82: ['Violent showers', '⛈'],
  85: ['Snow showers', '🌨'],
  86: ['Heavy snow showers', '🌨'],
  95: ['Thunderstorm', '⛈'],
  96: ['Thunderstorm w/ hail', '⛈'],
  99: ['Severe thunderstorm', '⛈'],
};

function wmoDesc(code){ return (WMO[code] || ['Unknown', '—'])[0]; }
function wmoIcon(code){ return (WMO[code] || ['Unknown', '—'])[1]; }
function round(n){ return Math.round(n); }

function setStatus(msg, isErr){
  if(!msg){
    statusEl.style.display = 'none';
    return;
  }
  statusEl.textContent = msg;
  statusEl.style.display = 'block';
  statusEl.className = isErr ? 'err' : '';
  heroEl.classList.remove('show');
  welcomeEl.style.display = 'none';
}

function showWelcome(){
  setStatus(null);
  heroEl.classList.remove('show');
  welcomeEl.style.display = 'block';
}

function geolocate(){
  setStatus('Finding your location…');
  if(!navigator.geolocation){
    showWelcome();
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => loadWeather(pos.coords.latitude, pos.coords.longitude, null),
    err => showWelcome(),
    { timeout: 5000, maximumAge: 600000 }
  );
}

async function reverseGeocode(lat, lon){
  try{
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=en&format=json`);
    const d = await r.json();
    if(d.results && d.results.length){
      const p = d.results[0];
      return [p.name, p.admin1, p.country].filter(Boolean).join(', ');
    }
  }catch(e){}
  return `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
}

async function loadWeather(lat, lon, placeName){
  welcomeEl.style.display = 'none';
  setStatus('Loading forecast…');
  currentCoords = { lat, lon };

  // US locations get Fahrenheit, everywhere else Celsius, matching local convention
  const isUS = lat > 24 && lat < 50 && lon > -125 && lon < -66;
  unit = isUS ? 'fahrenheit' : 'celsius';
  const speedUnit = isUS ? 'mph' : 'kmh';
  const precipUnit = isUS ? 'inch' : 'mm';

  const params = new URLSearchParams({
    latitude: lat, longitude: lon,
    current: 'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,is_day,precipitation',
    hourly: 'temperature_2m,weather_code,precipitation_probability',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,wind_direction_10m_dominant,sunrise,sunset,uv_index_max',
    temperature_unit: unit,
    wind_speed_unit: speedUnit,
    precipitation_unit: precipUnit,
    timezone: 'auto',
    forecast_days: 7
  });

  try{
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`, { signal: controller.signal });
    clearTimeout(timeoutId);
    if(!res.ok) throw new Error('Forecast API returned ' + res.status);
    const data = await res.json();

    if(!placeName){
      placeName = await reverseGeocode(lat, lon);
    }
    currentPlaceName = placeName;

    render(data, placeName, isUS);
  }catch(e){
    console.error('Weather load failed:', e);
    setStatus('Could not load weather data (' + (e.message || 'network error') + '). If you are viewing this inside the chat preview, download the file and open it in your browser instead.', true);
  }
}

function initMap(lat, lon, placeName){
  if(typeof L === 'undefined'){
    document.querySelector('.map-panel').style.display = 'none';
    return;
  }
  if(!leafletMap){
    leafletMap = L.map('map', {
      zoomControl: true,
      attributionControl: true,
      scrollWheelZoom: false
    }).setView([lat, lon], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap contributors'
    }).addTo(leafletMap);

    const brassIcon = L.divIcon({
      className: '',
      html: '<div style="width:14px;height:14px;border-radius:50%;background:#C9A227;border:2px solid #F0EBDD;box-shadow:0 0 0 3px rgba(201,162,39,0.25);"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });
    leafletMarker = L.marker([lat, lon], { icon: brassIcon }).addTo(leafletMap);
  } else {
    leafletMap.setView([lat, lon], 10);
    leafletMarker.setLatLng([lat, lon]);
  }
  if(placeName) leafletMarker.bindPopup(placeName);
  setTimeout(() => leafletMap.invalidateSize(), 200);
}

let currentData = null;
let currentIsUS = true;
let currentPlaceLabel = '';
let selectedDayIndex = 0;

function render(data, placeName, isUS){
  statusEl.style.display = 'none';
  heroEl.classList.add('show');

  currentData = data;
  currentIsUS = isUS;
  currentPlaceLabel = placeName;
  selectedDayIndex = 0;

  document.getElementById('place-line').textContent = placeName;

  document.getElementById('source-note').textContent =
    isUS
      ? 'Forecast for this US location draws on NOAA / National Weather Service model data via Open-Meteo.'
      : 'Forecast blends ECMWF and regional national weather service models via Open-Meteo.';

  initMap(currentCoords.lat, currentCoords.lon, placeName);
  renderDailyList();
  selectDay(0);
}

function selectDay(dayIndex){
  selectedDayIndex = dayIndex;
  document.querySelectorAll('.day-row').forEach(row => {
    row.classList.toggle('active', parseInt(row.dataset.index, 10) === dayIndex);
  });
  document.getElementById('hourly-label').textContent = dayIndex === 0 ? 'Next 24 hours' : 'Hour by hour';
  renderDial(dayIndex);
  renderHourly(dayIndex);
}

function renderDial(dayIndex){
  const data = currentData;
  const isUS = currentIsUS;
  const unitLabel = isUS ? '°F' : '°C';
  const speedLabel = isUS ? 'mph' : 'km/h';
  const precipUnitLabel = isUS ? 'in' : 'mm';

  const hi = data.daily.temperature_2m_max[dayIndex];
  const lo = data.daily.temperature_2m_min[dayIndex];
  const precipSum = data.daily.precipitation_sum[dayIndex];
  const precipChance = data.daily.precipitation_probability_max[dayIndex];
  const precipVal = isUS ? precipSum.toFixed(2) : precipSum.toFixed(1);
  const uv = data.daily.uv_index_max[dayIndex];
  const windDir = degToCompass(data.daily.wind_direction_10m_dominant[dayIndex]);
  const windSpeed = data.daily.wind_speed_10m_max[dayIndex];
  const sunrise = new Date(data.daily.sunrise[dayIndex]).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  const sunset = new Date(data.daily.sunset[dayIndex]).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

  document.getElementById('temp-unit').textContent = unitLabel;
  document.getElementById('today-hi').textContent = round(hi) + '°';
  document.getElementById('today-lo').textContent = round(lo) + '°';

  if(dayIndex === 0){
    const c = data.current;
    document.getElementById('temp-num').textContent = round(c.temperature_2m);
    document.getElementById('cond-icon').textContent = wmoIcon(c.weather_code);
    document.getElementById('cond-text').textContent = wmoDesc(c.weather_code);
    document.getElementById('feels-like').textContent = round(c.apparent_temperature) + '°';
    const now = new Date();
    document.getElementById('updated-line').textContent = 'Updated ' + now.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    const nowRaining = c.precipitation > 0;

    document.getElementById('details-grid').innerHTML = '';
    buildDetails([
      ['Precipitation', `${precipVal} ${precipUnitLabel}`, nowRaining ? `Falling now · ${round(precipChance)}% chance` : `${round(precipChance)}% chance today`],
      ['Wind', `${round(c.wind_speed_10m)} ${speedLabel}`, degToCompass(c.wind_direction_10m)],
      ['Humidity', `${round(c.relative_humidity_2m)}%`, ''],
      ['Pressure', `${round(c.surface_pressure)}`, 'hPa'],
      ['UV index', `${round(uv)}`, uvLabel(uv)],
      ['Sunrise', sunrise, ''],
      ['Sunset', sunset, ''],
    ]);
  } else {
    const dateObj = new Date(data.daily.time[dayIndex] + 'T12:00:00');
    document.getElementById('temp-num').textContent = round(hi);
    document.getElementById('cond-icon').textContent = wmoIcon(data.daily.weather_code[dayIndex]);
    document.getElementById('cond-text').textContent = wmoDesc(data.daily.weather_code[dayIndex]);
    document.getElementById('feels-like').textContent = round(data.daily.apparent_temperature_max[dayIndex]) + '°';
    document.getElementById('updated-line').textContent = dateObj.toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'}) + ' forecast';

    document.getElementById('details-grid').innerHTML = '';
    buildDetails([
      ['Precipitation', `${precipVal} ${precipUnitLabel}`, `${round(precipChance)}% chance`],
      ['Wind', `${round(windSpeed)} ${speedLabel}`, windDir],
      ['UV index', `${round(uv)}`, uvLabel(uv)],
      ['Sunrise', sunrise, ''],
      ['Sunset', sunset, ''],
    ]);
  }
}

function buildDetails(details){
  const grid = document.getElementById('details-grid');
  details.forEach(([label, val, sub]) => {
    const card = document.createElement('div');
    card.className = 'detail-card';
    card.innerHTML = `
      <div class="detail-label">${label}</div>
      <div class="detail-value">${val}</div>
      ${sub ? `<div class="detail-sub">${sub}</div>` : ''}
    `;
    grid.appendChild(card);
  });
}

function renderHourly(dayIndex){
  const data = currentData;
  const hourlyEl = document.getElementById('hourly-scroll');
  hourlyEl.innerHTML = '';

  let indices = [];
  if(dayIndex === 0){
    const nowISO = data.current.time;
    let startIdx = data.hourly.time.findIndex(t => t >= nowISO);
    if(startIdx < 0) startIdx = 0;
    for(let i = startIdx; i < Math.min(startIdx + 24, data.hourly.time.length); i++) indices.push(i);
  } else {
    const dateStr = data.daily.time[dayIndex];
    data.hourly.time.forEach((t, i) => { if(t.startsWith(dateStr)) indices.push(i); });
  }

  indices.forEach((i, idx) => {
    const t = new Date(data.hourly.time[i]);
    const label = (dayIndex === 0 && idx === 0) ? 'Now' : t.toLocaleTimeString([], {hour:'numeric'}).replace(':00','').toLowerCase().replace(' ','');
    const precip = data.hourly.precipitation_probability[i];
    const card = document.createElement('div');
    card.className = 'hour-card';
    card.innerHTML = `
      <div class="hour-time">${label}</div>
      <div class="hour-icon">${wmoIcon(data.hourly.weather_code[i])}</div>
      <div class="hour-temp">${round(data.hourly.temperature_2m[i])}°</div>
      <div class="hour-precip">${precip >= 20 ? precip + '%' : ''}</div>
    `;
    hourlyEl.appendChild(card);
  });
}

function renderDailyList(){
  const data = currentData;
  const allHi = data.daily.temperature_2m_max;
  const allLo = data.daily.temperature_2m_min;
  const rangeMin = Math.min(...allLo);
  const rangeMax = Math.max(...allHi);
  const span = Math.max(rangeMax - rangeMin, 1);

  const dailyEl = document.getElementById('daily-list');
  dailyEl.innerHTML = '';
  data.daily.time.forEach((dateStr, i) => {
    const d = new Date(dateStr + 'T12:00:00');
    const dayName = i === 0 ? 'Today' : d.toLocaleDateString([], {weekday:'short'});
    const hi = allHi[i], lo = allLo[i];
    const leftPct = ((lo - rangeMin) / span) * 100;
    const widthPct = ((hi - lo) / span) * 100;
    const precip = data.daily.precipitation_probability_max[i];

    const row = document.createElement('div');
    row.className = 'day-row';
    row.dataset.index = i;
    row.innerHTML = `
      <div class="day-name">${dayName}</div>
      <div class="day-icon">${wmoIcon(data.daily.weather_code[i])}</div>
      <div class="day-precip">${precip >= 20 ? precip + '%' : ''}</div>
      <div class="day-range">
        <div class="day-lo">${round(lo)}°</div>
        <div class="day-bar-track"><div class="day-bar-fill" style="left:${leftPct}%; width:${widthPct}%;"></div></div>
        <div class="day-hi">${round(hi)}°</div>
      </div>
    `;
    row.addEventListener('click', () => selectDay(i));
    dailyEl.appendChild(row);
  });
}

function degToCompass(deg){
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}
function uvLabel(uv){
  if(uv < 3) return 'Low';
  if(uv < 6) return 'Moderate';
  if(uv < 8) return 'High';
  if(uv < 11) return 'Very high';
  return 'Extreme';
}

// ---- search ----
const searchInput = document.getElementById('search-input');
const suggestionsEl = document.getElementById('suggestions');
let searchTimeout = null;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  const q = searchInput.value.trim();
  if(q.length < 2){
    suggestionsEl.classList.remove('show');
    return;
  }
  searchTimeout = setTimeout(() => doSearch(q), 300);
});

document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-row')){
    suggestionsEl.classList.remove('show');
  }
});

async function doSearch(q){
  try{
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`);
    const d = await r.json();
    suggestionsEl.innerHTML = '';
    if(!d.results || !d.results.length){
      suggestionsEl.innerHTML = '<div class="suggestion-item">No matches found</div>';
      suggestionsEl.classList.add('show');
      return;
    }
    d.results.forEach(p => {
      const label = [p.name, p.admin1, p.country].filter(Boolean).join(', ');
      const item = document.createElement('div');
      item.className = 'suggestion-item';
      item.textContent = p.name;
      const sub = document.createElement('span');
      sub.textContent = [p.admin1, p.country].filter(Boolean).join(', ');
      item.appendChild(sub);
      item.addEventListener('click', () => {
        suggestionsEl.classList.remove('show');
        searchInput.value = label;
        loadWeather(p.latitude, p.longitude, label);
      });
      suggestionsEl.appendChild(item);
    });
    suggestionsEl.classList.add('show');
  }catch(e){
    console.error('Search failed:', e);
    suggestionsEl.innerHTML = '<div class="suggestion-item">Search unavailable — ' + (e.message || 'network error') + '</div>';
    suggestionsEl.classList.add('show');
  }
}

document.getElementById('locate-btn').addEventListener('click', geolocate);

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const lat = parseFloat(chip.dataset.lat);
    const lon = parseFloat(chip.dataset.lon);
    const name = chip.dataset.name;
    searchInput.value = name;
    loadWeather(lat, lon, name);
  });
});

// initial load — try geolocation quietly, fall back to a welcome screen with quick shortcuts
geolocate();
</script>
